name: Simulation Bootstrap

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Number of weeks to simulate (default: 1 for test, 12 for full)'
        required: false
        default: '1'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run bootstrap
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: npx tsx simulation/scripts/bootstrap-history.ts --weeks=${{ inputs.weeks }}
