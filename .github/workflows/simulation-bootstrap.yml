name: Simulation Bootstrap

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Weeks to simulate (default: 6)'
        required: false
        default: '6'
      cap:
        description: 'Spend cap in USD (default: 0.75)'
        required: false
        default: '0.75'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run bootstrap
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: npx tsx simulation/scripts/bootstrap-history.ts --weeks=${{ inputs.weeks }} --cap=${{ inputs.cap }}
