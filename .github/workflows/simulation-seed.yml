name: Simulation Seed

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to seed'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - personas
          - venues

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Seed personas
        if: ${{ inputs.target == 'both' || inputs.target == 'personas' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx simulation/scripts/seed-personas.ts

      - name: Seed venues
        if: ${{ inputs.target == 'both' || inputs.target == 'venues' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx simulation/scripts/seed-bramford.ts
