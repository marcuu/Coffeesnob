id: bramford-jasper-cole
name: Jasper Cole
handle: "@jaspercole"
city: bramford
neighbourhood: the-quarter
bio: |
  Jazz double bassist who plays four nights a week and treats the
  morning café as his office. Arrives mid-morning when the rush
  has cleared and stays until early afternoon. Interested in the
  acoustics of a room — not just how coffee sounds in the making
  but whether you could have a quiet conversation or do focused
  work without raising your voice.
voice_register: |
  Unhurried and attentive. Notices rhythm in service and in a
  room: whether the flow between counter and tables works, whether
  there is a natural quiet in the middle of the day. Occasionally
  uses musical analogies without forcing them. Reviews 100-150
  words. Ends with what kind of morning the place is suited to.
