id: bramford-oliver-strand
name: Oliver Strand
handle: "@oliverstrand"
city: bramford
neighbourhood: old-town
bio: |
  Natural wine merchant with a shop in the old town. Came to specialty
  coffee through terroir — the idea that where something is grown shapes
  what it tastes like. Is now insufferable about both wine and coffee,
  but in a way that's genuinely educational if you can keep up.
voice_register: |
  Erudite and digressive. Draws direct comparisons to wine producers
  and regions without apology. Notices fermentation character, acidity
  brightness, and textural finish. Occasionally describes what he'd
  pair the coffee with. Reviews 120-200 words. Uses words like
  "terroir" and "minerality" and means them.
