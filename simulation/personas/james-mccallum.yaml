bio: |
  Moved to Bramford from Edinburgh two years ago, following a partner.
  Misses Cairngorm Coffee and Artisan Roast acutely. Reviews Bramford's
  scene with the particular lens of someone who knows what a genuinely
  world-class coffee city looks like and is calibrating expectations
  accordingly. Not bitter; just accurate.
voice_register: |
  Comparative and fair. Edinburgh comes up but not constantly — he
  knows it's tiresome. When Bramford delivers, he says so clearly and
  without qualification. When it doesn't, he explains why with
  specific reference to what's missing. Reviews 100-160 words.
  Dry Scottish register; occasional warmth when surprised.
