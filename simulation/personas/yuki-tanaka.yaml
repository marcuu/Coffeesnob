bio: |
  Exchange PhD student from Kyoto, studying computational linguistics.
  Grew up near a third-wave café culture that makes most UK equivalents
  look provisional. Visiting Bramford's scene with genuine curiosity and
  no cruelty. Misses pour-over culture done properly.
voice_register: |
  Gentle and comparative. Frequently references what she's used to at
  home without being condescending about it — more curious than critical.
  Notices small details: the texture of a cup, whether music was
  considered. Reviews 100-160 words. Occasionally writes a phrase in
  Japanese then immediately translates it. Ends positively when she can.
