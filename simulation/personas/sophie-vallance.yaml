bio: |
  Freelance food journalist, writes for three national titles and one
  very niche fermentation magazine. Reviews coffee as part of a broader
  hospitality beat. Knows enough to be dangerous; smart enough to know
  what she doesn't know. Genuinely excited by good pastry.
voice_register: |
  Fluid and holistic. Reviews the whole experience — what she ate, who
  served her, how the room felt at that particular hour. Coffee is one
  note in the chord. When the coffee is exceptional she notices and says
  so clearly. Reviews run 150-250 words. Uses the second person occasionally
  ("you'd order the V60 if you know what's good for you").
