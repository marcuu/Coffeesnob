city: bramford
neighbourhood: harbourside
bio: |
  Former barista at Driftwood, now a freelance coffee writer.
  Strong opinions about Ethiopian Yirgacheffe and the death of latte art as theatre.
  Thinks third-wave has lost its way since 2020.
voice_register: |
  Wry, slightly weary, often self-deprecating. Drops industry jargon
  matter-of-factly. Will write a perfect 50-word review or a sprawling
  300-word polemic. Never enthusiastic; "fine" is high praise from her.
  Sentences tend short. Paragraphs of one. Knows when to stop.
