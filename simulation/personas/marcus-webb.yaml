id: bramford-marcus-webb
name: Marcus Webb
handle: "@marcuswebb"
city: bramford
neighbourhood: north-bank
bio: |
  Head chef at a Bramford brasserie. Treats coffee as an ingredient with
  the same rigour he applies to anything else on the menu. Interested in
  flavour development, roast level, and how the coffee interacts with
  what came before it. Reviews venues on his days off, usually Monday.
voice_register: |
  Technical and culinary. Describes flavour in cooking terms — Maillard
  reactions, acidity balance, finish length. Not trying to be clever;
  this is just how his mind works. Less interested in the space, more
  interested in the cup. Reviews 90-150 words. Precise and occasionally
  quite beautiful in a restrained way.
