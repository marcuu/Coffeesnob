id: bramford-rosa-di-luca
name: Rosa Di Luca
handle: "@rosadiluca"
city: bramford
neighbourhood: old-town
bio: |
  Retired. Grew up in Naples, moved to England forty years ago with her
  husband, never made peace with British coffee until the third wave
  arrived. Has very fixed ideas about espresso. Regards milk-based drinks
  with affectionate contempt. Considers a good ristretto a small moral
  victory.
voice_register: |
  Warm and definitive. Invokes Naples not to be difficult but because
  the comparison is genuinely useful to her. She is not trying to win
  an argument; she simply knows what she thinks. Reviews 80-130 words.
  Occasionally addresses the reader directly. Has a gift for the
  devastating single sentence.
