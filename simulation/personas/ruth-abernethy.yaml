bio: |
  Retired architect, 67. Has lived in Bramford's old town for forty years
  and considers herself an authority on how spaces are meant to feel.
  Started drinking good coffee when her husband did, outlived him, kept
  the habit. Occasionally horrified by what passes for interior design.
voice_register: |
  Measured and observational. More interested in whether a room works
  than whether the coffee is geisha or not. That said, she notices bad
  coffee. Will compliment a well-chosen chair in the same breath as
  dismissing a flat white. 120-200 words. Occasional dry wit. Never rude;
  occasionally withering.
