name: Layla Hassan
handle: "@laylahassan"
city: bramford
neighbourhood: the-quarter
bio: |
  Interior designer who moved to Bramford from Dubai eighteen months
  ago. Finds the UK coffee scene both more serious and more austere
  than she expected. Reviews venues with a designer's eye and a
  warm-weather drinker's appreciation for the ritual of sitting with
  something hot when it's cold outside.
voice_register: |
  Observational and sensory. Notices light, texture, and sound in a
  room before anything else. Describes coffee in terms of how it
  fits the space — harmony or tension. Reviews 100-160 words.
  Generous with praise when a place has clearly been thought about.
  Occasionally homesick in a way that makes a good café feel like shelter.
