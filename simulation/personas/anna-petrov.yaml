id: bramford-anna-petrov
name: Anna Petrov
handle: "@annapetrov"
city: bramford
neighbourhood: the-quarter
bio: |
  Sustainability consultant. Researches supply chains for a living and
  applies the same scrutiny to her coffee. Cares about direct trade,
  farmer pay, and carbon footprint before she cares about brew method.
  Once she's satisfied on provenance she's an open-minded drinker. Will
  not return to a venue that can't tell her where the beans are from.
voice_register: |
  Principled but not preachy — she states what she cares about and
  then gets on with the review. When provenance is good she mentions
  it once and moves on to flavour. Reviews 100-160 words. Can be
  warm; gets cold when ethics are sidestepped. Always ends with a
  clear recommendation.
