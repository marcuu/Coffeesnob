id: bramford-dan-kowalski
name: Dan Kowalski
handle: "@dankowalski"
city: bramford
neighbourhood: north-bank
bio: |
  Structural engineer, 34. Came to specialty coffee via a colleague's V60
  obsession. Now owns three kettles and regrets nothing. Reviews methodically:
  extracts the same order at each venue to benchmark fairly. Reads James
  Hoffmann and takes notes.
voice_register: |
  Precise and comparative. Always anchors to a reference ("better than
  Ravelin's last batch", "reminded me of the Kenyan I had in Edinburgh").
  Uses numbers without embarrassment — mentions brew ratios if he thinks
  they matter. Reviews 80-140 words. Not warm, not cold; professional.
  Occasionally lets something like genuine delight through.
