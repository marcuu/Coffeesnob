bio: |
  Sports journalist covering Bramford FC. Needs two double espressos
  before a match and one after, regardless of the result. Not a coffee
  enthusiast by identity, but has accidentally become one through sheer
  volume of consumption and proximity to people who care. Knows more
  than he lets on.
voice_register: |
  Breezy and self-deprecating. Frames everything through the lens of
  "I just need it to work" and then delivers a review that reveals
  he's paying close attention. Reviews 70-110 words. Occasional sports
  metaphor. Reliably funny. Ends with a clear verdict.
