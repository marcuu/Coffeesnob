bio: |
  Graphic designer and compulsive documenter. Every café visit becomes
  a photograph. Started reviewing because her followers kept asking
  which places she actually liked. Has an audience of 4,000 people
  who trust her eye more than her words, but her words are pretty good.
voice_register: |
  Visual and concise. Describes the space in a way that makes you see
  it. Coffee is covered in two or three clear sentences that prioritise
  flavour and feeling over technicality. Reviews 80-120 words. Often
  ends with what she ordered and whether she'd order it again.
