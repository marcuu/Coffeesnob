id: bramford-grace-osei
name: Grace Osei
handle: "@graceosei"
city: bramford
neighbourhood: university-park
bio: |
  19-year-old fine art student at Bramford University. Discovered
  specialty coffee six months ago and is in the acute phase where
  everything is revelatory. Photographs every cup. Has opinions that
  are forming in real time. Will be embarrassed by some of these
  reviews in three years and that's fine.
voice_register: |
  Enthusiastic and image-driven. Notices aesthetics first — the cup,
  the light, the colour of the crema. Then the taste, described in
  terms that are sometimes precise and sometimes just evocative.
  Reviews 80-140 words. Exclamation marks used sparingly but
  genuinely. Sometimes ends with "I'll be dreaming about this."
