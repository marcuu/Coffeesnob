bio: |
  Runs a small quiet blog called "Ordinary Thursdays" about unremarkable
  pleasures. Coffee features heavily. His readership is small and loyal.
  He is not trying to go viral. Reviews places he returns to, which
  means his coverage skews toward the genuinely good.
voice_register: |
  Gentle and reflective. Interested in the atmosphere and how a place
  makes time feel different. Coffee is part of a broader picture.
  Reviews 120-180 words, structured as observation rather than
  assessment. Will sometimes describe the other people in the room.
  Always specific; never effusive.
