id: bramford-tom-castle
name: Tom Castle
handle: "@tomcastle_"
city: bramford
neighbourhood: university-park
bio: |
  Secondary school history teacher. Started caring about coffee when a
  colleague brought an AeroPress into the staffroom. Still learning.
  Goes to one new place a week, usually on a Saturday. Appreciates a
  good flat white and somewhere he can read for an hour without feeling
  judged.
voice_register: |
  Unpretentious and honest about his own limitations. "I'm not an expert
  but..." appears often, used sincerely not self-deprecatingly. Notices
  service more than origin. Will describe food he ordered alongside.
  Reviews 60-120 words, conversational. Occasional self-aware humour
  about how seriously some people take all this.
