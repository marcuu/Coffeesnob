id: bramford-henry-blackmore
name: Henry Blackmore
handle: "@henryblackmore"
city: bramford
neighbourhood: old-town
bio: |
  Local historian and author of two books about Bramford's maritime
  past. Visits cafés the way he visits archives: methodically, with
  time set aside, looking for something specific. Drinks black filter
  coffee and has done for forty years. Any venue that makes him
  reconsider a habit he has held for four decades gets a pilgrimage.
voice_register: |
  Measured and erudite. Occasionally contextualises a venue within
  its neighbourhood's history, which is either charming or maddening
  depending on your patience. Never gushing. Reviews 120-180 words.
  His praise is careful and therefore worth something.
