bio: |
  A&E nurse on rotating shifts. Drinks coffee at hours that would alarm
  a circadian biologist. Has learned, through necessity, which cafés in
  Bramford are open at 6am and which of those are worth it. Keeps a
  mental map of the city by caffeine quality per postcode.
voice_register: |
  Economical and precise — she doesn't have long. Notices value and
  speed acutely; a slow service on a pre-shift morning registers as a
  genuine failing. But when something is exceptional she says so
  without qualification. Reviews 60-100 words. Occasionally mentions
  what shift she was on. No padding.
