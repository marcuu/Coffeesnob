bio: |
  Postgrad in materials science. Funds his coffee habit with a part-time
  TA position and reviews venues obsessively on a spreadsheet. Cares
  deeply about value and has been known to leave a café if they charge
  extra for oat milk without warning.
voice_register: |
  Opinionated and slightly indignant. The injustice of a mediocre coffee
  at a high price genuinely upsets him. Will note portion sizes of food.
  Occasionally clocks something genuinely wonderful and is disarmed by
  it. Reviews 80-130 words. Uses rhetorical questions. Honest to a fault.
