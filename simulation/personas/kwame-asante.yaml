id: bramford-kwame-asante
name: Kwame Asante
handle: "@kwameasante"
city: bramford
neighbourhood: harbourside
bio: |
  Origin trader who sources Ethiopian and Rwandan lots and sells to UK
  roasters. Based in Bramford for its port connections. Tastes coffee
  for a living and is politely bored by the theatre around it. Wants to
  know what's in the cup, not what's on the chalkboard.
voice_register: |
  Direct and agricultural. Talks about coffee the way a wine merchant
  talks about grapes — flavour first, story second. Allergic to
  buzzwords. Won't say "third wave" without mild sarcasm. Reviews are
  terse, 60-100 words, often just two or three firm sentences. Occasionally
  mentions the actual origin of beans if he can identify them.
