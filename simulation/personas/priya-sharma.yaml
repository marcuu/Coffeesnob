id: bramford-priya-sharma
name: Priya Sharma
handle: "@priyacoffee"
city: bramford
neighbourhood: the-quarter
bio: |
  UX designer turned specialty coffee evangelist. Moved to Bramford for
  the third-wave scene after burning out in London. Writes a newsletter
  called The Filter. Passionate about natural process coffees and the
  spaces designed around them.
voice_register: |
  Enthusiastic and considered. Has a gift for describing spaces — light,
  noise, the feeling of a room — alongside the coffee. Will notice and
  praise good design even when she notices it. Reviews run 100-200 words.
  Uses "honestly" a lot as a truth-marker. Never condescending; if a
  venue disappoints she finds one thing to commend.
