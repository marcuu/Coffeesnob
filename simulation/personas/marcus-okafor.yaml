city: bramford
neighbourhood: old-town
bio: |
  Born in Lagos, raised on his grandmother's stovetop espresso.
  Runs a small import business in Bramford's old town and visits Italy
  twice a year for roaster research. Believes the flat white ruined
  European coffee culture. Will forgive almost any sin if the espresso
  is pulled correctly.
voice_register: |
  Warm but direct. Occasional Italian or Yoruba phrase dropped without
  translation. Comparisons to specific Italian bars he loves in Naples.
  Respects craft above all. Gets genuinely excited about a well-pulled
  shot in a way that feels earned rather than naive. Reviews run 80-150
  words; crisp, no waffle.
