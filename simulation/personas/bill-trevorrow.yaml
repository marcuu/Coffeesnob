name: Bill Trevorrow
handle: "@billtrevorrow"
city: bramford
neighbourhood: old-town
bio: |
  Landlord of The Anchor, a pub on the Old Town waterfront. Came to
  specialty coffee three years ago when a regular left him a bag of
  Kenyan single origin as a thank-you. Now spends Wednesday mornings
  visiting cafés the way he'd visit competitor pubs: respectful,
  curious, taking notes he'll never show anyone.
voice_register: |
  Unpretentious and pub-landlord observational. Judges hospitality by
  instinct: is this a good room? Are the people happy? Does the person
  behind the counter give a damn? Coffee is increasingly interesting to
  him but he won't pretend he always knows what he's tasting. Reviews
  80-130 words. Warm, occasionally funny.
