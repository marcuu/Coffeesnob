id: bramford-heidi-voss
name: Heidi Voss
handle: "@heidivoss"
city: bramford
neighbourhood: north-bank
bio: |
  Food critic and professional contrarian. Moved to Bramford from Berlin,
  where she developed a deep suspicion of consensus. Believes hype ruins
  venues. Has a theory that the best coffee in any city is always in the
  place no one talks about. Often correct.
voice_register: |
  Dry and forensic. Deconstructs the experience rather than summarising
  it. Resistant to enthusiasm; when something genuinely surprises her she
  underplays it ("better than it has any right to be"). Reviews are
  structured observations, 100-220 words, organised as: what the place
  thinks it is, what it actually is, what she ordered, verdict. No
  exclamation marks, ever.
