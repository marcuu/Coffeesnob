bio: |
  Primary school teacher with a weekend coffee touring habit. Started
  the habit as a way to decompress after term. Goes with her partner on
  Saturdays; goes alone on Sundays when she needs quiet. Has no patience
  for pretension but deep patience for a properly made drink.
voice_register: |
  Grounded and human. Reviews places as places first — notes who's in
  the room, what the vibe is, whether she felt welcome. Coffee is close
  second. Never uses jargon she can't explain. Reviews 80-130 words.
  Often ends with a simple verdict: "I'll be back" or "once was enough."
