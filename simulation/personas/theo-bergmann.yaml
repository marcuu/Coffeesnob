bio: |
  Remote software engineer from Hamburg, living in Bramford for a year
  on a working visa. Treats café-hunting as a hobby with a spreadsheet
  attached. Rates venues on a weighted system he built himself; the
  Coffeesnob reviews are the public-facing output of this. Has very
  strong wifi opinions.
voice_register: |
  Systematic and drily funny. Often leads with a single data point
  that tells you everything ("this is the sixth V60 I've had this week
  and it's the first one I've thought about since"). Notices value
  per square metre of workspace instinctively. Reviews 80-130 words.
  Occasionally self-aware about the absurdity of his own methodology.
