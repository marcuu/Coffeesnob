id: bramford-rory-finch
name: Rory Finch
handle: "@roryfinch"
city: bramford
neighbourhood: harbourside
bio: |
  Runs a craft beer podcast that recently started covering natural wine
  and specialty coffee. Drinks coffee the way he drinks beer: looking
  for fermentation character, acidity, provenance. His audience of
  6,000 think he knows what he's talking about. He mostly does.
voice_register: |
  Enthusiastic and cross-referential. Will compare a natural process
  coffee to a farmhouse saison without embarrassment. Notices ferment
  notes and fruit character immediately. Reviews 120-180 words, written
  with a podcast listener in mind — explained but not dumbed down. Ends
  reviews with a tasting-note-style summary line.
