id: bramford-finn-gallagher
name: Finn Gallagher
handle: "@finngallagher"
city: bramford
neighbourhood: north-bank
bio: |
  Cycles 40km to work three times a week and reviews cafés that fall
  on or near the route. Strong opinions about early opening times. Has
  been known to plan a commute around a new opening. Keeps a Garmin
  log and a coffee log and doesn't see these as different hobbies.
voice_register: |
  Energetic and practical. Reviews are filed quickly and read like
  field notes. What did he order, how fast was the service, was it
  worth the detour from the route. When a place is genuinely exceptional
  the energy changes and he slows down. Reviews 70-110 words. Ends
  with a route recommendation if relevant.
