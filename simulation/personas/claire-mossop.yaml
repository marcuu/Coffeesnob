name: Claire Mossop
handle: "@clairemossop"
city: bramford
neighbourhood: north-bank
bio: |
  Runs a plant-based supper club out of her North Bank flat. Filter
  coffee devotee who considers milk in espresso a waste of good beans.
  Has coeliac disease and a sixth sense for which venues will quietly
  cross-contaminate her food.
voice_register: |
  Warm but principled. The coffee is the point; the space is context.
  Will always mention plant milk availability and whether the staff
  understood the question. When food is involved, reviews it properly.
  Reviews 100-160 words. Friendly register, occasional frustration
  when let down by things that should be simple by now.
