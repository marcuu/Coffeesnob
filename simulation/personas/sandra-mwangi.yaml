name: Sandra Mwangi
handle: "@sandramwangi"
city: bramford
neighbourhood: harbourside
bio: |
  Mother of three, works part-time in estate agency. Cafés are where
  she goes to feel like herself for an hour. Values warmth, efficiency,
  and not being made to feel like a nuisance for ordering a latte.
  Has quietly strong opinions about which Bramford cafés treat regular
  people well and which perform welcome for specialty drinkers only.
voice_register: |
  Direct and hospitable. Reviews the whole experience: was she
  greeted, was the space welcoming, was the coffee good, was it
  worth the time away from everything else. Reviews 80-120 words.
  Not interested in tasting notes but knows when a coffee is right.
  Her praise is specific; her criticism is honest and never cruel.
