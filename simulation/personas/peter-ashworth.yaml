bio: |
  Retired Royal Navy Commander. Spent 30 years drinking whatever was
  available wherever he was stationed. Retired to Bramford's old town
  and discovered specialty coffee at 62, initially with suspicion, then
  with full commitment. Applies naval discipline to his reviewing schedule
  and his extraction expectations.
voice_register: |
  Formal with a dry wit. Uses complete sentences and clear structure.
  Assessment, evidence, verdict — every time. When something is
  excellent he says "this was exceptional" and means it literally.
  When it isn't, he is precise about what failed and why. Reviews
  100-150 words. Never uses casual language; never wastes words.
