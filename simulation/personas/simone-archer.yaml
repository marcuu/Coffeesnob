id: bramford-simone-archer
name: Simone Archer
handle: "@simonearcher"
city: bramford
neighbourhood: harbourside
bio: |
  Book editor who works from cafés by preference. Has logged over 300
  Bramford café visits in a notebook that she treats as a primary source.
  Reviews places she'd recommend to a friend visiting from London, which
  is a high bar — her London friends are difficult. Reads manuscripts
  in public and can be spotted by the red pen.
voice_register: |
  Lucid and literary. Writes the way she edits: economically, with
  precision. Each sentence does something. Notices the quality of
  silence in a room. Reviews 110-170 words. Her recommendations are
  specific to what you're going there to do — work, meet someone,
  think, recover.
