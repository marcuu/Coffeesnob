# Bramford fictional venue seed — v1 proof-of-concept (20 venues).
# City: Bramford, a fictional UK-coastal coffee-obsessed city. Population ~400k.
# Neighbourhoods: harbourside | the-quarter | north-bank | old-town | university-park
# Postcodes use the fictional BM prefix.
# All venues are is_fictional=true in the database.

venues:

  # ── Universally loved third-wave classics ─────────────────────────────────

  - id: bramford-driftwood
    name: Driftwood
    slug: bramford-driftwood
    neighbourhood: harbourside
    address_line1: 14 Harbour Walk
    address_line2: harbourside
    city: bramford
    postcode: BM1 1AA
    description: |
      The original third-wave anchor of Bramford's harbourside. Single-origin
      filter programme rotates weekly; espresso is tight and precise. No wifi,
      no laptop policy after 10am, no apologies. The founder trained in Oslo
      and it shows. Low ceiling, salvaged timber, the smell of good coffee
      before you've opened the door.
